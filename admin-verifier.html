<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Verificar Artesanos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .result.success {
      background: #c6f6d5;
      border: 2px solid #9ae6b4;
      color: #22543d;
    }

    .result.error {
      background: #fed7d7;
      border: 2px solid #fc8181;
      color: #742a2a;
    }

    .result.info {
      background: #bee3f8;
      border: 2px solid #90cdf4;
      color: #2c5282;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .details {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #cbd5e0;
    }

    .details div {
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .details strong {
      color: #2d3748;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.verified {
      background: #c6f6d5;
      color: #22543d;
    }

    .badge.pending {
      background: #feebc8;
      color: #7c2d12;
    }

    .admin-info {
      background: #f7fafc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #4a5568;
    }

    .admin-info code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Panel de Administrador</h1>
    <p class="subtitle">Verificación de Artesanos On-Chain</p>

    <div class="admin-info">
      <strong>Cuenta Admin:</strong> <code>GBXCO6TSZ3EYTZQPONQLKUC4KBL64S4IT26A65ABOJUSRPDYZ7RFW4BV</code><br>
      Usa el password: <code>stellar2024</code>
    </div>

    <div class="form-group">
      <label for="stellar_address">Dirección Stellar del Artesano</label>
      <input
        type="text"
        id="stellar_address"
        placeholder="GAESNY6OYQPSLDJWWYPFFB7KMUK7ZHDIJWVS4KUCDM7T3RHHOR4UBDCN"
        maxlength="56"
      />
    </div>

    <div class="form-group">
      <label for="admin_password">Password de Admin</label>
      <input
        type="password"
        id="admin_password"
        placeholder="stellar2024"
        value="stellar2024"
      />
    </div>

    <button class="btn btn-primary" onclick="checkArtisan()" id="checkBtn">
      🔍 Verificar Estado
    </button>

    <button class="btn btn-secondary" onclick="verifyArtisan()" id="verifyBtn" style="display: none;">
      ✅ Verificar Artesano On-Chain
    </button>

    <div id="result"></div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let currentArtisan = null;

    async function checkArtisan() {
      const address = document.getElementById('stellar_address').value.trim();
      const resultDiv = document.getElementById('result');
      const checkBtn = document.getElementById('checkBtn');
      const verifyBtn = document.getElementById('verifyBtn');

      if (!address) {
        resultDiv.innerHTML = '<div class="result error">❌ Ingresa una dirección Stellar</div>';
        return;
      }

      checkBtn.disabled = true;
      checkBtn.innerHTML = '<span class="spinner"></span>Verificando...';
      verifyBtn.style.display = 'none';
      resultDiv.innerHTML = '';

      try {
        const response = await fetch(`${API_URL}/admin/check/${address}`);
        const data = await response.json();

        currentArtisan = data;

        if (!data.registered) {
          resultDiv.innerHTML = `
            <div class="result error">
              ❌ <strong>Artesano NO Registrado</strong><br>
              Esta cuenta no está registrada en el contrato.
            </div>
          `;
        } else {
          const statusBadge = data.verified
            ? '<span class="badge verified">✓ Verificado</span>'
            : '<span class="badge pending">⏳ Pendiente</span>';

          resultDiv.innerHTML = `
            <div class="result success">
              ✅ <strong>Artesano Encontrado</strong>
              <div class="details">
                <div><strong>Nombre:</strong> <span>${data.name}</span></div>
                <div><strong>Estado:</strong> <span>${statusBadge}</span></div>
                <div><strong>Total Pagos:</strong> <span>${data.total_payments}</span></div>
                <div><strong>Dirección:</strong> <span style="font-size: 11px; word-break: break-all;">${data.stellar_address}</span></div>
              </div>
            </div>
          `;

          if (!data.verified) {
            verifyBtn.style.display = 'block';
          }
        }
      } catch (error) {
        console.error('Error checking artisan:', error);
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ <strong>Error de Conexión</strong><br>
            ${error.message}<br><br>
            <strong>Verificar:</strong><br>
            1. Backend corriendo en http://localhost:3001<br>
            2. Prueba abrir: <a href="http://localhost:3001/health" target="_blank">http://localhost:3001/health</a><br>
            3. Si no abre, reinicia el backend: <code>cd backend && npm run dev</code>
          </div>
        `;
      } finally {
        checkBtn.disabled = false;
        checkBtn.innerHTML = '🔍 Verificar Estado';
      }
    }

    async function verifyArtisan() {
      const address = document.getElementById('stellar_address').value.trim();
      const password = document.getElementById('admin_password').value;
      const resultDiv = document.getElementById('result');
      const verifyBtn = document.getElementById('verifyBtn');

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="spinner"></span>Verificando en blockchain...';

      try {
        const response = await fetch(`${API_URL}/admin/verify-artisan`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            artisan_address: address,
            admin_password: password
          })
        });

        const data = await response.json();

        if (data.success) {
          resultDiv.innerHTML = `
            <div class="result success">
              ✅ <strong>¡Artesano Verificado!</strong><br>
              El artesano ha sido verificado exitosamente en el contrato.<br><br>
              <strong>Hash de Transacción:</strong><br>
              <a href="https://stellar.expert/explorer/testnet/tx/${data.txHash}" target="_blank" style="color: #2c5282; word-break: break-all;">
                ${data.txHash}
              </a>
            </div>
          `;
          verifyBtn.style.display = 'none';
        } else {
          resultDiv.innerHTML = `
            <div class="result error">
              ❌ <strong>Error:</strong> ${data.error}
            </div>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ <strong>Error:</strong> ${error.message}
          </div>
        `;
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '✅ Verificar Artesano On-Chain';
      }
    }

    // Allow Enter key to trigger check
    document.getElementById('stellar_address').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkArtisan();
    });
  </script>
</body>
</html>
